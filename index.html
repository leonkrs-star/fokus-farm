<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fokus Farm</title>
<meta name="description" content="Fokus Farm – Tasks abhaken, Lernzeit tracken, Hof wachsen lassen.">
<meta name="theme-color" content="#2E6A45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fokus Farm">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Layout: Lernhof auf Millimeterpapier – oben Statusleiste, darunter ein Hauptbereich je Ansicht, max. 1080px */
:root{
  --bg:#EDF1E9; --grid:rgba(47,107,69,.07); --surface:#F9FBF6; --surface2:#E3E9DE;
  --ink:#1C2921; --muted:#5B695E; --line:#C9D2C3;
  --field:#2E6A45; --field-soft:#D6E6D8; --wheat:#B98117; --wheat-soft:#F3E3BC;
  --water:#2B6EA3; --water-soft:#D5E5F2; --soil:#7D5233; --soil-soft:#E7D7C7;
  --bad:#B0412B; --bad-soft:#F4D9D1; --ok:#2E6A45; --ok-soft:#D6E6D8;
  --shadow:0 1px 0 rgba(28,41,33,.06), 0 6px 20px -12px rgba(28,41,33,.35);
  --f-display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --f-math:'STIX Two Text', 'Cambria Math', 'Times New Roman', serif;
  --r:12px;
  --c1:#2E6A45; --c1s:#D6E6D8; --c2:#B0532C; --c2s:#F2DDD2; --c3:#7A4A93; --c3s:#E8DDF0; --c4:#93680F; --c4s:#F1E5C8; --c5:#3D58A6; --c5s:#DCE2F3;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111713; --grid:rgba(120,190,140,.05); --surface:#18211B; --surface2:#212C24;
  --ink:#E4ECE2; --muted:#98A69A; --line:#2E3A31;
  --field:#72B886; --field-soft:#203528; --wheat:#E0AE4A; --wheat-soft:#3A3020;
  --water:#73AADA; --water-soft:#1C2D3B; --soil:#BE8B65; --soil-soft:#33281F;
  --bad:#E5806A; --bad-soft:#3B231D; --ok:#72B886; --ok-soft:#203528;
  --c1:#72B886; --c1s:#203528; --c2:#E08A63; --c2s:#3A251C; --c3:#B993D0; --c3s:#2E2338; --c4:#DDB05A; --c4s:#3A2F1A; --c5:#8FA6E6; --c5s:#1F2840;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.8); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111713; --grid:rgba(120,190,140,.05); --surface:#18211B; --surface2:#212C24;
  --ink:#E4ECE2; --muted:#98A69A; --line:#2E3A31;
  --field:#72B886; --field-soft:#203528; --wheat:#E0AE4A; --wheat-soft:#3A3020;
  --water:#73AADA; --water-soft:#1C2D3B; --soil:#BE8B65; --soil-soft:#33281F;
  --bad:#E5806A; --bad-soft:#3B231D; --ok:#72B886; --ok-soft:#203528;
  --c1:#72B886; --c1s:#203528; --c2:#E08A63; --c2s:#3A251C; --c3:#B993D0; --c3s:#2E2338; --c4:#DDB05A; --c4s:#3A2F1A; --c5:#8FA6E6; --c5s:#1F2840;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.8); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg); background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:24px 24px;
  color:var(--ink); font:16px/1.55 var(--f-body); -webkit-font-smoothing:antialiased}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--water); outline-offset:2px; border-radius:6px}
h1,h2,h3{font-family:var(--f-display); line-height:1.15; text-wrap:balance; margin:0}
h1{font-size:clamp(1.6rem,4vw,2.3rem); font-weight:700; letter-spacing:-.01em}
h2{font-size:1.35rem; font-weight:650}
h3{font-size:1.05rem; font-weight:650}
p{margin:0}
.wrap{max-width:1080px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:700}

/* Kopfzeile */
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; gap:14px; padding-block:10px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; margin-right:auto}
.brand b{font-family:var(--f-display); font-size:1.12rem; letter-spacing:-.01em}
.brand small{display:block; font-size:.72rem; color:var(--muted); line-height:1}
.lvl{display:flex; align-items:center; gap:10px; min-width:0}
.lvl .badge{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--field); color:var(--surface); font:700 1rem var(--f-display)}
.lvl .meta{min-width:120px}
.lvl .meta div{font-size:.78rem; font-weight:700; white-space:nowrap}
.bar{height:7px; background:var(--surface2); border-radius:9px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--field); border-radius:9px; transition:width .5s}
.bar.wheat i{background:var(--wheat)} .bar.water i{background:var(--water)}
.res{display:flex; gap:8px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; background:var(--surface2); font:600 .86rem var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.chip.c{background:var(--wheat-soft); color:var(--ink)} .chip.w{background:var(--water-soft)} .chip.s{background:var(--soil-soft)}
.chip svg{width:16px; height:16px}
nav.tabs{display:flex; gap:4px; width:100%; overflow-x:auto}
nav.tabs a{padding:8px 14px; border-radius:9px; text-decoration:none; color:var(--muted); font-weight:700; font-size:.93rem; white-space:nowrap}
nav.tabs a.on{background:var(--field-soft); color:var(--ink)}
nav.tabs a:hover{color:var(--ink)}

main{padding-block:22px 64px}
.grid2{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:820px){ .grid2{grid-template-columns:minmax(0,1fr)} }
.stack{display:flex; flex-direction:column; gap:18px; min-width:0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--shadow); min-width:0}
.card.flat{box-shadow:none}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.sp{justify-content:space-between}
.btn{border:1px solid var(--line); background:var(--surface); padding:9px 15px; border-radius:10px; font-weight:700; font-size:.94rem; display:inline-flex; align-items:center; gap:7px; text-decoration:none; color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--field); border-color:var(--field); color:var(--surface)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.wheat{background:var(--wheat); border-color:var(--wheat); color:#1C1606}
.btn.water{background:var(--water); border-color:var(--water); color:var(--surface)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px; font-size:.84rem}
.btn[disabled]{opacity:.45; cursor:not-allowed; filter:none}
.pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:.75rem; font-weight:700; background:var(--surface2); color:var(--muted)}
.pill.exam{background:var(--wheat-soft); color:var(--ink)} .pill.ok{background:var(--ok-soft); color:var(--ok)} .pill.bad{background:var(--bad-soft); color:var(--bad)} .pill.gen{background:var(--water-soft); color:var(--ink)}

/* Hof */
.farm{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.plot{position:relative; aspect-ratio:1/0.92; max-width:100%; border-radius:12px; background:var(--soil-soft); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:6px 6px 8px; gap:4px; text-align:center}
.plot svg.crop{width:78%; height:auto; flex:1; min-height:0}
.plot .lab{font-size:.78rem; font-weight:700; line-height:1.15}
.plot .wbar{width:80%}
.plot.thirsty{outline:2px dashed var(--wheat); outline-offset:-4px}
.plot.ripe{background:var(--wheat-soft)}
.plot.locked{background:transparent; border-style:dashed; color:var(--muted)}
.plot button.cover{position:absolute; inset:0; background:transparent; border:0; border-radius:12px}
.plot button.cover:hover{background:rgba(127,127,127,.08)}
.seedlist{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:10px}
.seed{border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--surface); text-align:left; display:flex; gap:10px; align-items:center}
.seed svg{width:40px; height:40px; flex:none}
.seed small{display:block; color:var(--muted); font-size:.76rem}
.seed[disabled]{opacity:.5}

.goal{display:flex; align-items:center; gap:14px}
.ring{--p:0; width:64px; height:64px; border-radius:50%; background:conic-gradient(var(--field) calc(var(--p)*1%), var(--surface2) 0); display:grid; place-items:center; flex:none}
.ring span{width:50px; height:50px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font:700 .9rem var(--f-mono)}
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.stat{background:var(--surface2); border-radius:10px; padding:10px 12px}
.stat b{display:block; font:700 1.25rem var(--f-mono)}
.stat span{font-size:.8rem; color:var(--muted)}
.navgrid button.cur{outline:2px solid var(--ink)}
.navgrid button.r{background:var(--ok-soft); border-color:var(--ok)} .navgrid button.f{background:var(--bad-soft); border-color:var(--bad)}
.hearts{display:flex; gap:3px} .hearts svg{width:20px; height:20px}
.big{font:700 2.6rem var(--f-display); letter-spacing:-.02em}
details.rv{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface)}
details.rv summary{cursor:pointer; font-weight:600}
details.rv[open] summary{margin-bottom:8px}

/* Modi & Laden */
.modes{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px}
.mode{display:flex; flex-direction:column; gap:10px}
.mode .lockinfo{font-size:.84rem; color:var(--muted)}
.mode .bar{margin-top:2px}
.shop{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px}
.rw{display:flex; flex-direction:column; gap:8px}
.rw .price{font:700 1.1rem var(--f-mono); color:var(--wheat)}
.rw input{border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:var(--surface); width:100%}
.vouchers{display:flex; flex-direction:column; gap:6px}
.vch{display:flex; justify-content:space-between; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.vch.used{opacity:.6}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:50; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; width:min(92vw,420px)}
.toast div{background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:11px; font-weight:700; font-size:.92rem; box-shadow:var(--shadow); animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(8px); opacity:0}}
.modal{position:fixed; inset:0; z-index:60; background:rgba(10,15,12,.45); display:grid; place-items:center; padding:max(16px, env(safe-area-inset-left,0px))}
.modal .card{max-width:440px; width:100%; text-align:center}
.flash{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.fc{min-height:180px; display:flex; flex-direction:column; justify-content:center; gap:10px; text-align:center; font-size:1.08rem}
.fc .back{color:var(--field); font-weight:600}
.note{font-size:.82rem; color:var(--muted)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
@media (max-width:560px){
  .lvl .meta{min-width:90px}
  .farm{gap:7px}
  .unit{grid-template-columns:46px minmax(0,1fr); }
  .unit .mring{grid-column:1; grid-row:1}
  .unit .go{display:none}
  .navgrid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
.seed small.sg{color:var(--ok); font-weight:600}
.chap{border-left:4px solid var(--field); padding-left:12px}
/* Pflanzenbilder und Gießpause */
.plot img.crop{width:92%; height:auto; flex:1; min-height:0; object-fit:contain; object-position:center bottom; user-select:none; -webkit-user-drag:none; transition:transform .25s}
.plot img.crop.dry{filter:saturate(.45) brightness(.95)}
.plot.ripe img.crop{animation:sway 3.2s ease-in-out infinite; transform-origin:50% 90%}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.2deg) translateY(-1px)}}
.seed img.crop{width:44px; height:auto; flex:none}
.plot.cool img.crop{opacity:.78}
.plot .cdb{position:absolute; top:6px; right:6px; display:inline-flex; align-items:center; gap:3px; padding:2px 7px 2px 5px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font:600 .74rem var(--f-mono); font-variant-numeric:tabular-nums; z-index:1; pointer-events:none}
.plot .cdb svg{width:12px; height:12px; opacity:.6}
/* Belohnungs-Animation */
.fly{position:fixed; z-index:80; pointer-events:none; display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:999px; font:800 .95rem var(--f-mono); box-shadow:0 6px 16px -6px rgba(0,0,0,.45); white-space:nowrap; opacity:0}
.fly svg{width:16px; height:16px}
.fly.xp{background:var(--field); color:var(--surface)}
.fly.c{background:var(--wheat); color:#fff}
.fly.w{background:var(--water); color:#fff}
.fly.w svg path{fill:#fff}
.spark{position:fixed; z-index:79; pointer-events:none; width:16px; height:16px; opacity:0}
.spark svg{width:16px; height:16px; display:block}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){ .pop,.plot.ripe img.crop{animation:none} body,.top{transition:none} }

.plot .lbar{width:80%; height:4px; margin-top:-1px}
.plot .lbar i{background:var(--wheat)}
/* ===== Fokus Farm: Tasks, Timer, Feiern ===== */
.brand .logo{width:34px; height:34px; flex:none}
.iconbtn{border:1px solid var(--line); background:var(--surface); width:36px; height:36px; border-radius:10px; display:grid; place-items:center; padding:0}
.iconbtn svg{width:18px; height:18px}

/* I Showed Up */
.shows{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.show{display:flex; align-items:center; gap:12px; text-align:left; padding:12px 14px; border-radius:14px; border:1.5px dashed var(--line); background:var(--surface); color:var(--ink); transition:transform .15s, box-shadow .15s}
.show .snum{width:38px; height:38px; flex:none; border-radius:50%; display:grid; place-items:center; font:800 1.05rem var(--f-display); background:var(--surface2); color:var(--muted)}
.show .snum svg{width:20px; height:20px}
.show b{display:block; font-family:var(--f-display); font-size:1.05rem}
.show small{display:flex; gap:8px; flex-wrap:wrap; color:var(--muted); font:600 .78rem var(--f-mono); margin-top:2px}
.show small span{display:inline-flex; align-items:center; gap:3px}
.show small svg{width:13px; height:13px}
.show.next{border:2px solid var(--wheat); background:linear-gradient(135deg,var(--wheat-soft),var(--surface) 75%); box-shadow:0 8px 22px -14px var(--wheat)}
.show.next .snum{background:var(--wheat); color:#1C1606; animation:breathe 2.2s ease-in-out infinite}
.show.next:hover{transform:translateY(-2px)}
.show.next:active{transform:scale(.98)}
.show.done{border-style:solid; border-color:transparent; background:var(--ok-soft)}
.show.done .snum{background:var(--ok); color:var(--surface)}
.show[disabled]{cursor:default}
.show[disabled]:not(.done){opacity:.55}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(224,174,74,.55)}50%{box-shadow:0 0 0 8px rgba(224,174,74,0)}}

/* Tasks */
.tasks{display:flex; flex-direction:column; gap:6px}
.task{display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--line); border-radius:11px; background:var(--surface)}
.task .tmain{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.task .tname{font-weight:700; overflow-wrap:anywhere}
.task .trw{display:flex; gap:8px; flex-wrap:wrap; align-items:center; color:var(--muted); font:600 .76rem var(--f-mono)}
.task .trw>span{display:inline-flex; align-items:center; gap:3px}
.task .trw svg{width:12px; height:12px}
.task .trw .pill{font-family:var(--f-body)}
.tchk{width:30px; height:30px; flex:none; border-radius:50%; border:2px solid var(--field); background:var(--surface); display:grid; place-items:center; padding:0; color:var(--surface)}
.tchk:hover:not([disabled]){background:var(--field-soft)}
.tchk svg{width:16px; height:16px}
.task.done{opacity:.62}
.task.done .tchk{background:var(--field); border-color:var(--field)}
.task.done .tname{text-decoration:line-through}
.tform{display:grid; grid-template-columns:minmax(0,1fr) auto auto auto; gap:8px; align-items:end}
.tform label{display:flex; flex-direction:column; gap:4px; font-size:.78rem; color:var(--muted); font-weight:700; min-width:0}
.tform input,.tform select{border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:var(--surface); color:var(--ink); width:100%; min-width:0; font-weight:400; font-size:.95rem}
@media (max-width:640px){ .tform{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .tform label:first-child{grid-column:1/-1} .tform .btn{grid-column:1/-1; justify-content:center} }
.task.editing{flex-direction:column; align-items:stretch}
.empty{padding:14px; border:1px dashed var(--line); border-radius:11px; text-align:center; color:var(--muted); font-size:.9rem}
.linkish{background:none; border:0; padding:0; color:var(--field); font-weight:700; text-decoration:underline; font-size:.88rem}

/* Lern-Timer */
.tcard{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.tring{--p:0; width:124px; height:124px; flex:none; border-radius:50%; background:conic-gradient(var(--wheat) calc(var(--p)*1%), var(--surface2) 0); display:grid; place-items:center; transition:background .4s}
.tring>div{width:104px; height:104px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center}
.tring b{font:700 1.55rem var(--f-mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.tring small{font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:700}
.tring.run{animation:tglow 3s ease-in-out infinite}
@keyframes tglow{0%,100%{box-shadow:0 0 0 0 rgba(224,174,74,.0)}50%{box-shadow:0 0 0 6px rgba(224,174,74,.18)}}
.tside{flex:1; min-width:180px; display:flex; flex-direction:column; gap:10px}
.plot .lbar{width:80%; height:4px; margin-top:-1px}
.plot .tbadge{position:absolute; top:6px; left:6px; display:inline-flex; align-items:center; padding:2px 6px; border-radius:999px; background:var(--wheat-soft); font:700 .68rem var(--f-mono); pointer-events:none; z-index:1}
.plot .tbadge svg{width:11px; height:11px}

/* Feiern */
canvas.confetti{position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:75}
.burst{position:fixed; inset:0; z-index:77; display:grid; place-items:center; pointer-events:none}
.burst .rays{position:absolute; width:min(130vw,760px); aspect-ratio:1; border-radius:50%;
  background:repeating-conic-gradient(var(--wheat) 0deg 9deg, transparent 9deg 22.5deg);
  -webkit-mask:radial-gradient(circle, #000 8%, transparent 68%); mask:radial-gradient(circle, #000 8%, transparent 68%);
  opacity:0; animation:rays 2.4s ease-out forwards}
.burst.harvest .rays{background:repeating-conic-gradient(var(--field) 0deg 9deg, transparent 9deg 22.5deg)}
.burst.timer .rays{background:repeating-conic-gradient(var(--water) 0deg 9deg, transparent 9deg 22.5deg)}
.burst .bcard{position:relative; background:var(--surface); border:2px solid var(--wheat); border-radius:22px; padding:18px 26px 16px; text-align:center; box-shadow:0 24px 60px -20px rgba(0,0,0,.55);
  animation:bin .7s cubic-bezier(.2,1.7,.4,1) both; max-width:min(90vw,420px)}
.burst.harvest .bcard{border-color:var(--field)} .burst.timer .bcard{border-color:var(--water)}
.burst .bart{width:96px; margin:-62px auto 2px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.25)); animation:bart 1.1s cubic-bezier(.2,1.6,.4,1) both}
.burst .bart img,.burst .bart svg{width:100%; height:auto; display:block}
.burst .bey{font-size:.74rem; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:var(--muted)}
.burst .btitle{font:800 clamp(2rem,7vw,2.8rem)/1.05 var(--f-display); letter-spacing:-.02em; margin:4px 0 6px;
  background:linear-gradient(90deg,var(--wheat),var(--bad),var(--wheat)); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 1.6s linear infinite}
.burst.harvest .btitle{background-image:linear-gradient(90deg,var(--field),var(--wheat),var(--field))}
.burst.timer .btitle{background-image:linear-gradient(90deg,var(--water),var(--field),var(--water))}
.burst .bsub{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.burst .bsub .chip{animation:bchip .5s cubic-bezier(.2,1.7,.4,1) both}
.burst .bsub .chip:nth-child(2){animation-delay:.12s} .burst .bsub .chip:nth-child(3){animation-delay:.24s}
.burst .bnote{margin-top:8px; font-size:.88rem; color:var(--muted)}
.burst .dots{display:flex; gap:8px; justify-content:center; margin-top:10px}
.burst .dots i{width:14px; height:14px; border-radius:50%; background:var(--surface2)}
.burst .dots i.on{background:var(--wheat); animation:bchip .5s cubic-bezier(.2,1.7,.4,1) both}
.burst.out{opacity:0; transition:opacity .45s ease}
@keyframes bin{0%{transform:scale(.3) rotate(-8deg); opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes bart{0%{transform:translateY(40px) scale(.3) rotate(-20deg); opacity:0}100%{transform:none; opacity:1}}
@keyframes bchip{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes rays{0%{opacity:0; transform:scale(.4) rotate(0)}25%{opacity:.5}100%{opacity:0; transform:scale(1.15) rotate(60deg)}}
@keyframes shine{to{background-position:-200% 0}}
.wave{position:fixed; z-index:73; pointer-events:none; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; border:4px solid var(--wheat); opacity:0}
.cpop{position:fixed; z-index:76; pointer-events:none; width:90px; margin:-45px 0 0 -45px}
.cpop img,.cpop svg{width:100%; height:auto; display:block}
.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-3px,1px) rotate(-.4deg)}40%{transform:translate(3px,-1px) rotate(.4deg)}60%{transform:translate(-2px,0)}80%{transform:translate(2px,0)}}
.chip.big{font-size:1rem; padding:6px 12px}
.chip.big svg{width:18px; height:18px}
.chip.x{background:var(--field); color:var(--surface)}
.settings{display:flex; flex-direction:column; gap:10px}
.settings .row .note{flex:1; min-width:180px}

/* Hinweis: nur vorübergehende Speicherung */
.card.warn{display:flex; gap:12px; align-items:flex-start; margin-bottom:18px; background:var(--wheat-soft); border-color:var(--wheat)}
.card.warn .wico{width:30px; height:30px; flex:none; border-radius:50%; background:var(--wheat); color:#1C1606; display:grid; place-items:center; font:800 1.1rem var(--f-display)}
.card.warn .wtx{display:flex; flex-direction:column; gap:8px; min-width:0}
.card.warn p{font-size:.9rem}

/* Spruch unter I Showed Up 3 */
.enough{width:100%; margin-top:8px; padding:10px 14px; border-radius:14px; border:1.5px dashed var(--line); background:var(--surface); text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); transition:transform .15s}
.enough small{display:flex; gap:8px; align-items:center; justify-content:center; font:600 .78rem var(--f-mono); color:var(--muted); margin-top:2px}
.enough small span{display:inline-flex; align-items:center; gap:3px}
.enough small svg{width:13px; height:13px}
.enough[disabled]{cursor:default}
.enough.on{animation:breathe 2.2s ease-in-out infinite}
.enough.on:hover{transform:translateY(-2px)}
.enough.done{border-style:solid; border-color:transparent; background:var(--ok-soft); color:var(--ink)}
.enough.done b{opacity:1}
.enough b{font:800 1.05rem var(--f-display); color:var(--ink); opacity:.55}
.enough span{font-size:.84rem}
.enough.on{border-style:solid; border-color:var(--wheat); background:linear-gradient(135deg,var(--wheat-soft),var(--surface) 80%); color:var(--ink)}
.enough.on b{opacity:1; color:var(--bad)}

.burst.feierabend .bcard{border-color:var(--bad)}
.burst.feierabend .rays{background:repeating-conic-gradient(var(--bad) 0deg 9deg, transparent 9deg 22.5deg)}

</style></head><body>

<script>
(()=>{
'use strict';
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const yesterday=()=>dkey(new Date(Date.now()-864e5));

// ---------- Spielwerte ----------
const APP='Fokus Farm';
const TIMER_MIN=45;                 // eine Lernzeit-Session
const TITLES=['Setzling','Gießkannen-Neuling','Saatgut-Sammler','Beetpfleger','Feldarbeiter','Erntehelfer','Jungbauer','Hofgärtner','Ackerprofi','Obstgärtner',
  'Hofbesitzer','Großbauer','Erntemeister','Gutsverwalter','Agrar-Stratege','Landwirt des Jahres','Fokus-Farmer','Hof-Legende','Ernte-Virtuose','Meister der Felder'];
// Farm-Mechanik unverändert aus Mikro Farm: Saatkosten, 4× Wasser bis zur Ernte, Gießpause in Sekunden
const CROPS=[
  {id:'weizen',n:'Weizen',lvl:1,cost:0,need:4,coins:25,xp:15,cd:120},
  {id:'karotte',n:'Karotten',lvl:2,cost:10,need:4,coins:45,xp:25,cd:300},
  {id:'mais',n:'Mais',lvl:4,cost:20,need:4,coins:75,xp:35,cd:420},
  {id:'sonne',n:'Sonnenblumen',lvl:6,cost:30,need:4,coins:110,xp:50,cd:600},
  {id:'kuerbis',n:'Kürbis',lvl:8,cost:45,need:4,coins:160,xp:70,cd:720},
  {id:'apfel',n:'Apfelbaum',lvl:11,cost:70,need:4,coins:280,xp:120,cd:900}
];
const CMAP={}; CROPS.forEach(c=>CMAP[c.id]=c);
const PLOT_PRICE=[0,0,0,0,100,150,220,300,400];
const SHOWUP=[{xp:15,coins:8,water:2},{xp:20,coins:12,water:2},{xp:30,coins:20,water:3}];
const ENOUGH={xp:25,coins:15,water:2};   // „Genug gelernt für heute“ nach I Showed Up 3
const SIZES={
  s:{n:'Klein',xp:10,coins:5,water:1},
  m:{n:'Mittel',xp:25,coins:12,water:2},
  l:{n:'Groß',xp:60,coins:30,water:4}
};
const DEFAULT_TASKS=[
  {n:'15 Minuten Karteikarten wiederholen',size:'s',rep:'daily'},
  {n:'Eine Übungsaufgabe komplett lösen',size:'m',rep:'daily'},
  {n:'Ein Kapitel zusammenfassen',size:'l',rep:'once'}
];
const DEFAULT_SHOP=[
  {id:'keks',n:'Ein Keks',p:60},{id:'limo',n:'Eine Limo',p:120},{id:'kaffee',n:'Ein Kaffee',p:120},
  {id:'lesen',n:'30 Min. Lesen',p:180},{id:'serie',n:'Eine Folge Serie',p:200},{id:'mandeln',n:'Gebrannte Mandeln',p:250}
];
const ACH=[
  {id:'show1',t:'Zum ersten Mal aufgetaucht',c:15,f:s=>s.stats.showups>=1},
  {id:'harvest',t:'Erste Ernte',c:30,f:s=>s.stats.harvests>=1},
  {id:'h25',t:'25 Ernten',c:120,f:s=>s.stats.harvests>=25},
  {id:'sess1',t:'Erste 45-Minuten-Session',c:30,f:s=>s.stats.sessions>=1},
  {id:'sess20',t:'20 Lern-Sessions',c:200,f:s=>s.stats.sessions>=20},
  {id:'task10',t:'10 Tasks erledigt',c:60,f:s=>s.stats.tasks>=10},
  {id:'task50',t:'50 Tasks erledigt',c:200,f:s=>s.stats.tasks>=50},
  {id:'streak7',t:'7 Tage in Folge aufgetaucht',c:150,f:s=>s.streak.n>=7},
  {id:'lvl10',t:'Level 10',c:100,f:s=>levelInfo(s.xp).l>=10}
];

// ---------- Zustand ----------
const KEY='fokusfarm-save-v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function fresh(){
  return {v:1, xp:0, coins:30, water:3,
    farm:{n:4, plots:[{},{},{},{}]},
    shop:{items:DEFAULT_SHOP.map(x=>({...x})), vouchers:[]},
    tasks:DEFAULT_TASKS.map(t=>({id:uid(), n:t.n, size:t.size, rep:t.rep, done:''})),
    showup:{d:today(), n:0}, timer:null,
    stats:{harvests:0, tasks:0, showups:0, sessions:0, focusMin:0},
    streak:{n:0, last:''}, ach:{}, sound:true, updatedAt:0};
}
function normalize(s){
  const f=fresh(); if(!s||typeof s!=='object') return f;
  for(const k in f){ if(s[k]===undefined) s[k]=f[k]; }
  for(const k in f.stats){ if(s.stats[k]===undefined) s.stats[k]=0; }
  if(!s.farm||!Array.isArray(s.farm.plots)) s.farm=f.farm;
  while(s.farm.plots.length<s.farm.n) s.farm.plots.push({});
  if(!Array.isArray(s.tasks)) s.tasks=[];
  if(!s.shop||!Array.isArray(s.shop.items)) s.shop=f.shop;
  return s;
}
let S=(()=>{ try{ const raw=localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){} return fresh(); })();

// Speichern: immer im Browser; auf claude.ai zusätzlich im eigenen Konto (geräteübergreifend)
// Wo wird gespeichert?
// - Eigenständige Datei / eigene Web-Adresse: im Browser (dauerhaft).
// - Claude-Artifact als Besitzer: im Claude-Konto (geräteübergreifend).
// - Claude-Artifact als Gast über einen geteilten Link: Claude erlaubt Gästen kein Speichern im Konto,
//   und Safari löscht den Browser-Speicher eingebetteter Seiten beim Schließen → nur vorübergehend ('temp').
const WEB_URL='https://leonkrs-star.github.io/fokus-farm/';   // dauerhafte Web-Version (z. B. GitHub Pages); leer = keine
const FRAMED=(()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
let docRef=null, syncState=FRAMED?'checking':'local', saveTimer=null, writing=false, pending=false, warnHidden=false;
function setSync(st){ if(syncState===st) return; const wasWarn=syncState==='temp'||syncState==='checking'; syncState=st; if(route==='hof' && (wasWarn||st==='temp')) render(); else paintSync(); }
function save(){
  S.updatedAt=Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(docRef){ clearTimeout(saveTimer); saveTimer=setTimeout(pushCloud,1500); }
}
async function pushCloud(){
  if(!docRef) return; if(writing){ pending=true; return; }
  writing=true;
  try{ await docRef.set({state:JSON.parse(JSON.stringify(S)), updatedAt:S.updatedAt}); setSync('cloud'); }
  catch(e){ if(e && (e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted'||e.code==='capability_disabled')){ docRef=null; setSync(FRAMED?'temp':'local'); } }
  writing=false; if(pending){ pending=false; pushCloud(); }
  paintSync();
}
async function initCloud(tries){
  tries=tries||0;
  const noCloud=()=>{ docRef=null; setSync(FRAMED?'temp':'local'); };
  try{
    if(!window.claude || !window.claude.use){ if(FRAMED && tries<6){ setTimeout(()=>initCloud(tries+1),800); } else noCloud(); return; }
    const [d,u]=await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!d || !u) return noCloud();
    const id=await u.id(); if(!id) return noCloud();
    try{ if(u.can){ const w=await u.can('data.write'); if(w===false) return noCloud(); } }catch(e){}
    docRef=d.doc('data/users/'+id+'/spielstand');
    let done=false; const t=setTimeout(()=>{ if(!done){ setSync('slow'); } },10000);
    const snap=await docRef.get(); done=true; clearTimeout(t);
    if(snap.exists){
      const data=snap.data();
      if(data && data.state && (data.updatedAt||0)>(S.updatedAt||0)){
        S=normalize(JSON.parse(JSON.stringify(data.state)));
        try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
        syncState='cloud'; prevTop=null; render(); return;
      }
      setSync('cloud');
      if(((data||{}).updatedAt||0)<(S.updatedAt||0)) pushCloud();
    } else {
      // Erster Besuch mit Konto: einmal schreiben – klappt das nicht, ist es eine Gast-Ansicht
      await pushCloud();
    }
    paintSync();
  }catch(e){ noCloud(); }
}
function syncText(){
  if(syncState==='cloud') return 'Dein Hof wird in deinem Claude-Konto gespeichert und ist auf allen Geräten gleich.';
  if(syncState==='slow') return 'Der Konto-Speicher antwortet noch nicht – dein Hof liegt vorerst in diesem Browser.';
  if(syncState==='temp') return 'In dieser geteilten Ansicht wird dein Hof nur vorübergehend gespeichert: Safari löscht ihn beim Schließen des Browsers. Sichere ihn vorher per Backup'+(WEB_URL?' oder nutze die dauerhafte Web-Version.':'.');
  if(syncState==='checking') return 'Speicherort wird geprüft …';
  return 'Dein Hof wird in diesem Browser gespeichert. Für ein anderes Gerät: Backup exportieren und dort importieren.';
}
function paintSync(){ const el=$('#sync'); if(el) el.textContent=syncText(); }

// ---------- Logik ----------
function levelInfo(xp){ let l=1, need=120; while(xp>=need){ xp-=need; l++; need=120+40*(l-1); } return {l, cur:xp, need, title:TITLES[Math.min(l,20)-1]+(l>20?' +'+(l-20):'')}; }
let levelUp=null;
function addXP(n){ const before=levelInfo(S.xp).l; S.xp+=n; const after=levelInfo(S.xp); if(after.l>before) levelUp=after; }
function give(r){ addXP(r.xp||0); S.coins+=r.coins||0; S.water+=r.water||0; }
function checkAch(){ ACH.forEach(a=>{ if(!S.ach[a.id] && a.f(S)){ S.ach[a.id]=today(); S.coins+=a.c; toast('Erfolg: '+a.t+' · +'+a.c+' Münzen'); } }); }
function tickDaily(){ if(!S.showup || S.showup.d!==today()) S.showup={d:today(), n:0}; }
function streakNow(){ return (S.streak.last===today()||S.streak.last===yesterday())?S.streak.n:0; }
function bumpStreak(){ const t=today(); if(S.streak.last===t) return; S.streak.n=(S.streak.last===yesterday())?S.streak.n+1:1; S.streak.last=t; }
function isDone(t){ return t.rep==='daily' ? t.done===today() : !!t.done; }
function cdLeft(p){ return p&&p.nw ? Math.max(0, Math.ceil((p.nw-Date.now())/1000)) : 0; }
function fmtCd(s){ return Math.floor(s/60)+':'+pad(s%60); }
function growingPlots(){ return S.farm.plots.filter(p=>p.c&&!p.dead&&p.w<CMAP[p.c].need); }
function plotState(p){
  if(!p.c) return {st:'empty'};
  if(p.dead) return {st:'dead'};
  const cr=CMAP[p.c]; const ripe=p.w>=cr.need;
  const age=(Date.now()-(p.lw||p.t))/36e5;
  if(!ripe && age>96){ p.dead=true; save(); return {st:'dead'}; }
  return {st: ripe?'ripe':(age>48?'thirsty':'grow'), stage: ripe?3:Math.min(2,Math.floor(3*p.w/cr.need)), cr};
}
// Timer
function timerLeft(){ const T=S.timer; if(!T) return TIMER_MIN*60; if(T.paused) return T.left; return Math.max(0,Math.ceil((T.end-Date.now())/1000)); }
function fmtT(s){ return pad(Math.floor(s/60))+':'+pad(s%60); }

// ---------- Icons ----------
const IC={
  coin:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="var(--wheat)"/><circle cx="8" cy="8" r="4.2" fill="none" stroke="var(--wheat-soft)" stroke-width="1.3"/></svg>',

let AC=null;
function tone(seq){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const t0=AC.currentTime+0.02;
    seq.forEach(([f,dt,dur,type,vol])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+dt); g.gain.exponentialRampToValueAtTime(vol||0.16,t0+dt+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+dur);
      o.connect(g); g.connect(AC.destination); o.start(t0+dt); o.stop(t0+dt+dur+0.05); });
  }catch(e){}
}

// Konfetti auf einer Canvas-Ebene
let cv=null, ctx=null, parts=[], raf=0;
function confetti(x,y,n,o){
  if(RM()) return; o=o||{};
  if(!cv){ cv=document.createElement('canvas'); cv.className='confetti'; document.body.appendChild(cv); ctx=cv.getContext('2d'); }
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==innerWidth*dpr||cv.height!==innerHeight*dpr){ cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  const cols=['--wheat','--field','--water','--bad','--soil'].map(cssVar).concat(['#F2C230','#E07A2E','#B993D0','#ffffff']);
  const dir=o.dir==null?-Math.PI/2:o.dir, spread=o.spread||Math.PI*0.9, power=o.power||11;
  for(let i=0;i<n;i++){
    const a=dir+(Math.random()-0.5)*spread, v=power*(0.45+Math.random()*0.75);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:0.22+Math.random()*0.12,w:6+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6.3,vr:(Math.random()-0.5)*0.35,
      c:cols[(Math.random()*cols.length)|0],life:0,max:120+Math.random()*70,sh:Math.random()<0.28?1:(Math.random()<0.12?2:0)});
  }
  if(!raf) raf=requestAnimationFrame(step);
}
function step(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life<p.max && p.y<innerHeight+30);
  for(const p of parts){
    p.vx*=0.985; p.vy=p.vy*0.985+p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
    const a=p.life>p.max*0.7?Math.max(0,1-(p.life-p.max*0.7)/(p.max*0.3)):1;
    ctx.save(); ctx.globalAlpha=a; ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.scale(1,Math.cos(p.life*0.18)); ctx.fillStyle=p.c;
    if(p.sh===1){ ctx.beginPath(); ctx.arc(0,0,p.w/2.4,0,6.3); ctx.fill(); }
    else if(p.sh===2){ ctx.beginPath(); for(let k=0;k<5;k++){ const an=k*1.2566-1.5708, an2=an+0.6283; ctx.lineTo(Math.cos(an)*p.w*0.7,Math.sin(an)*p.w*0.7); ctx.lineTo(Math.cos(an2)*p.w*0.3,Math.sin(an2)*p.w*0.3); } ctx.closePath(); ctx.fill(); }
    else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  }
  raf=parts.length?requestAnimationFrame(step):0;
  if(!raf) ctx.clearRect(0,0,innerWidth,innerHeight);
}

function flyReward(kind,n,target,i,big){

// ---------- Timer-Takt ----------
function paintTimer(){
  const T=S.timer; const left=timerLeft();
  const tl=$('#tleft'); if(tl) tl.textContent=fmtT(left);
  const tr=$('#tring'); if(tr) tr.style.setProperty('--p',(100*(1-left/(TIMER_MIN*60))).toFixed(2));
  const pct=T?(100*(1-left/(TIMER_MIN*60))).toFixed(1)+'%':'0%';
  document.querySelectorAll('[data-lb]').forEach(e=>e.style.width=pct);
  document.title=(T&&!T.paused)?fmtT(left)+' · '+APP:APP;
}
function completeSession(){
  const grown=[];
  for(const p of growingPlots()){ const cr=CMAP[p.c]; p.w++; p.lw=Date.now(); grown.push(cr.n+(p.w>=cr.need?' ist erntereif':' ist gewachsen')); }
  S.timer=null; ui.abort=false; S.stats.sessions++; S.stats.focusMin+=TIMER_MIN;
  checkAch(); save(); render();
  tone(SND.timer);
  confetti(innerWidth/2,innerHeight*0.45,120,{spread:Math.PI*2,power:10});
  const list=[...new Set(grown)];
  burst('timer','<div class="bey">Lernzeit</div><div class="btitle">'+TIMER_MIN+' Minuten geschafft!</div><div class="bnote">'+(list.length?esc(list.join(' · ')):'Diesmal war nichts gesät – säe vor der nächsten Session.')+'</div>',3200);
}
setInterval(()=>{
  const T=S.timer;
  if(T && !T.paused && Date.now()>=T.end){ completeSession(); return; }
  if(T) paintTimer();
  if(route!=='hof') return;
  const els=document.querySelectorAll('[data-cd]'); let done=false;
  els.forEach(e=>{ const r=Math.ceil((+e.dataset.cd-Date.now())/1000); if(r<=0) done=true; else e.textContent=fmtCd(r); });
  if(done) render();
},1000);

// ---------- Aktionen ----------
function taskById(id){ return S.tasks.find(t=>t.id===id); }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, d=b.dataset;
  switch(act){
    case 'closemodal': b.closest('.modal').remove(); break;
    case 'sound': S.sound=!S.sound; save(); paintTop(); if(S.sound) tone(SND.task); break;
    // Hof
    case 'sow': ui.sow=+d.i; render(); break;
    case 'cancelsow': ui.sow=null; render(); break;
    case 'plant': { const c=CMAP[d.c]; if(S.coins>=c.cost && ui.sow!=null){ S.coins-=c.cost; S.farm.plots[ui.sow]={c:c.id,w:0,t:Date.now(),lw:Date.now()}; ui.sow=null; save(); render(); } break; }
    case 'waterone': { const p=S.farm.plots[+d.i]; const cl=cdLeft(p);
      if(cl){ toast(CMAP[p.c].n+' braucht noch '+fmtCd(cl)+' min, bis es wieder Wasser aufnimmt'); break; }
      if(S.water>0){ S.water--; p.w++; p.lw=Date.now(); p.nw=Date.now()+CMAP[p.c].cd*1000; save(); render(); } else toast('Gießkanne leer – erledige einen Task, um Wasser zu sammeln'); break; }
    case 'waterall': { let n=0; for(const p of S.farm.plots){ if(S.water<=0) break; if(p.c&&!p.dead&&p.w<CMAP[p.c].need&&!cdLeft(p)){ p.w++; p.lw=Date.now(); p.nw=Date.now()+CMAP[p.c].cd*1000; S.water--; n++; } }
      if(!n) toast('Gerade braucht keine Pflanze Wasser'); save(); render(); break; }
    case 'harvest': { const i=+d.i; const p=S.farm.plots[i]; if(!p||!p.c) break; const c=CMAP[p.c]; const pl=b.closest('.plot'); const rect=pl.getBoundingClientRect(); const art=cropArt(p.c,3,'');
      S.coins+=c.coins; addXP(c.xp); S.stats.harvests++; S.farm.plots[i]={}; checkAch(); save();
      BIG=true; render(); BIG=false; celebrateHarvest(rect,art,c); break; }
    case 'clear': S.farm.plots[+d.i]={}; save(); render(); break;
    case 'buyplot': { const pr=PLOT_PRICE[S.farm.n]; if(S.coins>=pr && S.farm.n<9){ S.coins-=pr; S.farm.n++; S.farm.plots.push({}); save(); render(); } break; }
    // I Showed Up
    case 'enough': { tickDaily(); if(S.showup.n<3 || S.showup.e) break; const pt=lastPt;
      S.showup.e=true; give(ENOUGH); checkAch(); save(); BIG=true; render(); BIG=false; celebrateEnough(pt); break; }
    case 'showup': { tickDaily(); const i=+d.i; if(i!==S.showup.n || i>2) break; const r=SHOWUP[i]; const pt=lastPt;
      S.showup.n++; S.stats.showups++; if(i===0) bumpStreak(); give(r); checkAch(); save();
      BIG=true; render(); BIG=false; celebrateShowup(i,pt,r); break; }
    // Timer
    case 'tstart': S.timer={end:Date.now()+TIMER_MIN*60000, started:Date.now()}; ui.abort=false; save(); render(); tone([[660,0,.12,'sine']]); break;
    case 'tpause': if(S.timer&&!S.timer.paused){ S.timer={paused:true,left:timerLeft(),started:S.timer.started}; save(); render(); } break;
    case 'tresume': if(S.timer&&S.timer.paused){ S.timer={end:Date.now()+S.timer.left*1000,started:S.timer.started}; save(); render(); } break;
    case 'tabort': ui.abort=true; render(); break;
    case 'tabortno': ui.abort=false; render(); break;
    case 'tabortyes': S.timer=null; ui.abort=false; save(); render(); break;
    // Tasks
    case 'dotask': { const t=taskById(d.id); if(!t||isDone(t)) break; const r=SIZES[t.size]||SIZES.s; const pt=lastPt;
      t.done=today(); S.stats.tasks++; give(r); checkAch(); save(); render();
      tone(SND.task); if(pt) confetti(pt.x,pt.y,28+(t.size==='l'?40:t.size==='m'?15:0),{power:8}); break; }
    case 'edittask': ui.edit=d.id; render(); break;
    case 'canceledit': ui.edit=null; render(); break;
    case 'deltask': S.tasks=S.tasks.filter(t=>t.id!==d.id); ui.edit=null; save(); render(); break;
    case 'undotask': { const t=taskById(d.id); if(t){ t.done=''; save(); render(); } break; }
    case 'cleardone': S.tasks=S.tasks.filter(t=>!(t.rep==='once'&&t.done)); save(); render(); break;
    // Daten
    case 'export': ui.exp=true; ui.imp=false; render(); break;
    case 'hidewarn': warnHidden=true; render(); break;
    case 'quickexp': { const txt=backupText(); try{ navigator.clipboard.writeText(txt).then(()=>toast('Backup kopiert – z. B. in Notizen sichern'),()=>{ go('tasks'); ui.exp=true; render(); }); }catch(err){ go('tasks'); ui.exp=true; render(); } break; }
    case 'quickimp': go('tasks'); ui.imp=true; render(); { const t=$('#impbox'); if(t) t.focus(); } break;
    case 'closeexp': ui.exp=false; render(); break;
    case 'import': ui.imp=true; ui.exp=false; render(); break;
    case 'closeimp': ui.imp=false; render(); break;
    case 'copyexp': { const t=$('#expbox'); try{ navigator.clipboard.writeText(t.value).then(()=>toast('Backup kopiert'),()=>{ t.select(); toast('Markiert – jetzt mit Strg/Cmd+C kopieren'); }); }catch(err){ t.select(); toast('Markiert – jetzt mit Strg/Cmd+C kopieren'); } break; }
    case 'dlexp': exportSave(); break;
    case 'doimp': importText(($('#impbox')||{}).value||''); break;
    case 'reset': ui.reset=true; render(); break;
    case 'resetno': ui.reset=false; render(); break;
    case 'resetyes': { const keepSound=S.sound; S=fresh(); S.sound=keepSound; ui={}; prevTop=null; save(); render(); toast('Neuer Hof angelegt'); break; }
    // Laden
    case 'buy': ui.buy=+d.i; render(); break;
    case 'buyno': ui.buy=null; render(); break;
    case 'buyyes': { const it=S.shop.items[+d.i]; if(it&&S.coins>=it.p){ S.coins-=it.p; S.shop.vouchers.push({id:uid(), n:it.n, d:today(), used:false}); toast('Gutschein: '+it.n+' – gönn es dir!'); save(); if(lastPt) confetti(lastPt.x,lastPt.y,40,{power:9}); } ui.buy=null; render(); break; }
    case 'usev': { const v=S.shop.vouchers.find(x=>x.id===d.id); if(v){ v.used=true; save(); render(); } break; }
    case 'editshop': ui.editshop=!ui.editshop; save(); render(); break;
    case 'addrw': S.shop.items.push({id:'c'+uid(), n:'Neue Belohnung', p:100}); save(); render(); break;
    case 'delrw': S.shop.items.splice(+d.i,1); save(); render(); break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const fd=new FormData(f); const n=String(fd.get('n')||'').trim().slice(0,80); if(!n) return;
  const size=SIZES[fd.get('size')]?fd.get('size'):'s', rep=fd.get('rep')==='daily'?'daily':'once';
  if(f.dataset.form==='addtask'){ S.tasks.push({id:uid(), n, size, rep, done:''}); save(); render(); const inp=$('[data-form=addtask] input[name=n]'); if(inp) inp.focus(); toast('Task hinzugefügt'); }
  else if(f.dataset.form==='edittask'){ const t=taskById(f.dataset.id); if(t){ if(t.rep!==rep) t.done=''; t.n=n; t.size=size; t.rep=rep; } ui.edit=null; save(); render(); }
});
document.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset || !t.dataset.edit) return; const it=S.shop.items[+t.dataset.i]; if(!it) return;
  if(t.dataset.edit==='n') it.n=t.value.slice(0,60); else it.p=Math.max(1,Math.round(+t.value||1));
  clearTimeout(window.__ed); window.__ed=setTimeout(save,600);
});
document.addEventListener('change',e=>{
  const t=e.target; if(!t.matches || !t.matches('[data-imp]') || !t.files || !t.files[0]) return;
  const rd=new FileReader();
  rd.onload=()=>importText(String(rd.result));
  rd.readAsText(t.files[0]);
});
function backupText(){ return JSON.stringify({app:'fokusfarm', v:1, exported:new Date().toISOString(), state:S}); }
function importText(txt){
  try{ const data=JSON.parse(txt); const st=data&&data.app==='fokusfarm'?data.state:data; if(!st||!st.farm||!st.tasks) throw 0;
    S=normalize(st); ui={}; prevTop=null; save(); render(); toast('Backup importiert'); }
  catch(err){ toast('Das ist kein Fokus-Farm-Backup'); }
}
async function exportSave(){
  const name='fokus-farm-backup-'+today()+'.json', txt=backupText();
  if(window.claude && window.claude.use){
    try{ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename:name, data:txt}); toast('Backup gespeichert'); return; } }
    catch(e){ toast('Speichern abgebrochen – nutze „Kopieren“'); return; }
  }
  const blob=new Blob([txt],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  toast('Backup wird heruntergeladen');
}
document.addEventListener('click',e=>{ const a=e.target.closest('[data-nav]'); if(!a) return; e.preventDefault(); go(a.dataset.nav); });
window.addEventListener('hashchange',()=>{ const h=hashRoute(); if(h && h!==route){ route=h; ui={}; render(); window.scrollTo(0,0); } });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ const T=S.timer; if(T&&!T.paused&&Date.now()>=T.end) completeSession(); else if(route==='hof') render(); } });
window.addEventListener('storage',e=>{ if(e.key===KEY && e.newValue){ try{ S=normalize(JSON.parse(e.newValue)); prevTop=null; render(); }catch(err){} } });

render();
if(S.timer && !S.timer.paused && Date.now()>=S.timer.end) setTimeout(completeSession,400);
initCloud();
})();

</script>
</body></html>
